services:
  - type: web
    name: fairshare-api
    env: ruby
    plan: free
    buildCommand: bundle install && bundle exec rails db:migrate
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "enabled"
      - key: RAILS_SERVE_STATIC_FILES
        value: "enabled"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fairshare-postgres
          property: connectionString

databases:
  - name: fairshare-postgres
    plan: free
